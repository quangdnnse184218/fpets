# Giữ project Supabase (gói Free) không bị tạm dừng vì không có hoạt động:
# mỗi ngày gọi API đọc 1 sản phẩm bằng anon key (quyền chỉ đọc dữ liệu công khai).
# Cần khai báo 2 secret trong GitHub: Settings > Secrets and variables > Actions
#   SUPABASE_URL       = giá trị NEXT_PUBLIC_SUPABASE_URL (vd. https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY  = giá trị NEXT_PUBLIC_SUPABASE_ANON_KEY
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 1 * * *" # 08:00 giờ Việt Nam hằng ngày
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Bỏ khoảng trắng / xuống dòng thừa khi dán secret; chỉ giữ https://xxxx.supabase.co
          # (bỏ "/", "/rest/v1"... phía sau nếu lỡ dán cả đường dẫn)
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#^(https://[^/]+).*#\1#')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')

          if [ -z "$url" ]; then echo "::error::Chưa khai báo secret SUPABASE_URL"; exit 1; fi
          if [ -z "$key" ]; then echo "::error::Chưa khai báo secret SUPABASE_ANON_KEY"; exit 1; fi
          case "$url" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL phải có dạng https://xxxx.supabase.co"; exit 1 ;;
          esac

          # Key dạng JWT (eyJ...) gửi kèm Authorization; key publishable mới (sb_publishable_...) chỉ cần apikey
          auth=()
          case "$key" in eyJ*) auth=(-H "Authorization: Bearer $key") ;; esac

          status=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            "$url/rest/v1/products?select=id&limit=1" \
            -H "apikey: $key" "${auth[@]}")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            cat /tmp/body.json
            echo "::error::Supabase trả về HTTP $status (401: sai key; 000: sai URL)"
            exit 1
          fi
          echo "Supabase OK"
