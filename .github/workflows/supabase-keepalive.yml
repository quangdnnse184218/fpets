# Giữ project Supabase (gói Free) không bị tạm dừng vì không có hoạt động:
# mỗi ngày gọi API đọc 1 sản phẩm bằng anon key (quyền chỉ đọc dữ liệu công khai).
# Cần khai báo 2 secret trong GitHub: Settings > Secrets and variables > Actions
#   SUPABASE_URL       = giá trị NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_ANON_KEY  = giá trị NEXT_PUBLIC_SUPABASE_ANON_KEY
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 1 * * *" # 08:00 giờ Việt Nam hằng ngày
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Thiếu secret SUPABASE_URL hoặc SUPABASE_ANON_KEY" >&2
            exit 1
          fi
          status=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          cat /tmp/body.json
          [ "$status" = "200" ]
